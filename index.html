</style></head><body><main class="room"><div class="light"></div><header class="top"><div class="brand"><small>THE CLASSROOM ARCHIVE · 1990s</small><h1>旧时光课本阅览室</h1></div><div class="clock">一九九五年 · 某个晴朗的午后</div></header><section class="hero"><p>那些年，我们一起翻过的书</p><h2>推开记忆的门，重读少年时光。</h2></section><section class="shelf-wrap"><div class="shelf-title">第一排书架 · 童年的课堂</div><div id="shelf" class="shelf"></div><p class="note">点击一本课本，开始翻阅 · 当前为示例书目，等待真实课本内容</p></section></main><section class="reader" id="reader" role="dialog" aria-modal="true" aria-label="课本阅读器"><header class="reader-header"><div><div class="subtle">正在阅读 / NOW READING</div><h2 id="reader-title"></h2></div><button class="plain" id="close">放回书架 ×</button></header><div class="desk"><div class="spread" id="spread"><div class="page left" id="left"></div><div class="page right" id="right"></div></div><nav class="controls"><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></div><p class="note">← → 方向键翻页 · Esc 返回书架</p></section><script>

const $=id=>document.getElementById(id);let active=null,index=0;books.forEach(b=>{let el=document.createElement("button");el.className="book";el.innerHTML='<span class="grade">'+b.grade+'</span><strong>'+b.title+'</strong><span class="publisher">'+b.publisher+'</span>';el.setAttribute("aria-label","阅读"+b.grade+b.title);el.onclick=()=>{if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){openBook(b);return}const rect=el.getBoundingClientRect();const ghost=el.cloneNode(true);ghost.classList.add("book-flight");Object.assign(ghost.style,{left:rect.left+"px",top:rect.top+"px",width:rect.width+"px",height:rect.height+"px",margin:"0"});document.body.appendChild(ghost);const dx=innerWidth/2-(rect.left+rect.width/2),dy=innerHeight/2-(rect.top+rect.height/2);const anim=ghost.animate([{transform:"translate(0,0) scale(1) rotate(0)",opacity:1},{transform:`translate(${dx*.48}px,${dy*.48}px) scale(1.15) rotate(-5deg)`,opacity:1,offset:.48},{transform:`translate(${dx}px,${dy}px) scale(2.1) rotateY(-30deg)`,opacity:0}],{duration:630,easing:"cubic-bezier(.2,.7,.2,1)"});anim.finished.then(()=>ghost.remove()).catch(()=>ghost.remove());setTimeout(()=>openBook(b),390)};$("shelf").append(el)});function openBook(b){active=b;index=0;$("reader-title").textContent=b.grade+" · "+b.title;$("reader").classList.add("open");document.body.style.overflow="hidden";render()}function closeBook(){$("reader").classList.remove("open");document.body.style.overflow="";active=null}function render(direction=""){if(!active)return;let pages=active.pages;for(let [id,n] of [["left",index],["right",index+1]]){let el=$(id);el.className="page "+id+(direction?" turn-"+direction:"");el.innerHTML="";if(n<pages.length){let img=document.createElement("img");img.src=pages[n];img.alt="第"+(n+1)+"页";img.onerror=()=>{el.innerHTML='<div class="placeholder"><b>页面暂不可用</b><span>请检查图片路径</span></div>'};el.append(img)}else{el.innerHTML='<div class="placeholder"><b>'+active.title+'</b><span>旧时光，慢慢读。这里将呈现真实课本扫描页。</span></div>'}let num=document.createElement("span");num.className="page-num";num.textContent=n<pages.length?n+1:"";el.append(num)}$("prev").disabled=index===0;$("next").disabled=index+2>=Math.max(pages.length,2);$("counter").textContent=pages.length?(Math.min(index+1,pages.length)+"–"+Math.min(index+2,pages.length)+" / "+pages.length):"等待课本页面"}function turn(d){if(!active)return;let next=index+d*2;if(next<0||next>=Math.max(active.pages.length,2))return;index=next;render(d>0?"right":"left")}$("close").onclick=closeBook;$("prev").onclick=()=>turn(-1);$("next").onclick=()=>turn(1);document.addEventListener("keydown",e=>{if(!active)return;if(e.key==="Escape")closeBook();if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)});let touchX=null;$("spread").addEventListener("touchstart",e=>{touchX=e.touches[0].clientX},{passive:true});$("spread").addEventListener("touchend",e=>{if(touchX===null)return;let diff=e.changedTouches[0].clientX-touchX;if(Math.abs(diff)>55)turn(diff<0?1:-1);touchX=null},{passive:true});
