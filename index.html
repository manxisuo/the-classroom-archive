<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旧时光课本阅览室</title><style>
:root{font-family:"Noto Serif SC","Songti SC",serif;color:#f3e4c5;background:#171e19}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 75% 10%,#63745b44,transparent 50%),#171e19}button{font:inherit;cursor:pointer}.room{min-height:100vh;position:relative;overflow:hidden}.light{position:absolute;right:-10%;top:-20%;width:65%;height:85%;background:linear-gradient(125deg,#e9c58d22,transparent 70%);transform:rotate(-13deg);pointer-events:none}.top{padding:28px clamp(22px,5vw,75px);display:flex;justify-content:space-between;align-items:center;gap:15px}.brand small{display:block;letter-spacing:.24em;color:#b7a88b;font-size:11px}.brand h1{margin:5px 0;font-size:clamp(23px,3vw,39px);font-weight:500;letter-spacing:.15em}.clock{font-size:13px;color:#b7a88b}.hero{text-align:center;padding:25px 15px 30px}.hero p{color:#b7a88b;font-size:14px;letter-spacing:.15em}.hero h2{font-weight:400;font-size:clamp(20px,3vw,32px);letter-spacing:.12em}.shelf-wrap{max-width:1100px;margin:0 auto;padding:15px 24px 80px}.shelf-title{display:flex;align-items:center;gap:15px;color:#c4b395;font-size:13px;letter-spacing:.2em}.shelf-title:after{content:"";height:1px;background:#a98a5944;flex:1}.shelf{position:relative;display:flex;align-items:end;gap:clamp(9px,2vw,24px);padding:36px 35px 23px;min-height:245px;border:12px solid #46301e;border-bottom:20px solid #694729;background:linear-gradient(135deg,#201e18,#292b20 65%,#393021);box-shadow:inset 0 10px 25px #0008,0 18px 25px #0006;flex-wrap:wrap}.shelf:after{content:"";position:absolute;bottom:-23px;left:-25px;right:-25px;height:13px;background:linear-gradient(#92623b,#50341f);box-shadow:0 12px 18px #0008}.book{position:relative;border:0;border-radius:3px 8px 5px 3px;width:clamp(85px,12vw,130px);height:clamp(150px,20vw,200px);padding:15px 8px;color:#342c1c;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:inset -7px 0 8px #0002,5px 5px 8px #0007;transition:transform .3s,filter .3s;transform-origin:bottom}.book:hover,.book:focus-visible{transform:translateY(-18px) rotate(-2deg);filter:brightness(1.12)}.book:before{content:"";position:absolute;left:9px;top:0;bottom:0;border-left:1px solid #0002}.book .grade{font-size:11px}.book strong{font-size:clamp(20px,2.4vw,29px);writing-mode:vertical-rl;letter-spacing:.2em;font-weight:600}.book .publisher{font-size:9px}.book:nth-child(6n+1){background:#d8c49c}.book:nth-child(6n+2){background:#b6c6ac}.book:nth-child(6n+3){background:#c4a88c}.book:nth-child(6n+4){background:#aab9bc}.book:nth-child(6n+5){background:#d2b67b}.book:nth-child(6n){background:#b9a4a1}.note{text-align:center;color:#a69b82;font-size:12px;margin-top:55px;letter-spacing:.1em}.reader{position:fixed;inset:0;background:#121710ef;z-index:10;display:none;flex-direction:column;align-items:center;padding:15px;overflow:auto}.reader.open{display:flex}.reader-header{width:min(1100px,100%);display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0 20px;color:#e7d7b8}.reader-header h2{font-weight:400;font-size:19px;margin:0}.subtle{color:#aa9c7d;font-size:12px}.plain{border:1px solid #a99a7955;background:#ffffff0b;color:#e7d7b8;border-radius:4px;padding:9px 15px}.desk{width:min(1100px,100%);padding:clamp(15px,3vw,40px);background:repeating-linear-gradient(2deg,#69452d,#69452d 8px,#6d4930 10px,#63412b 17px);border:10px solid #50331f;box-shadow:0 20px 50px #0009}.spread{display:grid;grid-template-columns:1fr 1fr;max-width:920px;margin:auto;min-height:min(63vh,580px);perspective:1400px;filter:drop-shadow(8px 10px 8px #0007)}.page{background:#e9dfc5;color:#342d20;position:relative;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:25px;box-shadow:inset 0 0 35px #a78d5c33;overflow:hidden}.page.left{border-radius:6px 0 0 6px;background:linear-gradient(90deg,#e9dfc5 88%,#bdb093)}.page.right{border-radius:0 6px 6px 0;background:linear-gradient(90deg,#b9ad91,#e9dfc5 12%)}.page img{width:100%;height:100%;object-fit:contain;position:absolute;inset:0}.placeholder{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;border:1px solid #a18d6a55;padding:15px}.placeholder b{font-size:clamp(17px,3vw,30px);font-weight:400}.placeholder span{font-size:12px;color:#8a7c65;line-height:2}.page-num{position:absolute;bottom:14px;font-size:12px;color:#77694e}.controls{display:flex;align-items:center;justify-content:center;gap:20px;margin:22px auto 0;flex-wrap:wrap}.controls button{background:#e1d1ab;color:#2c2a20;border:0;padding:11px 20px;border-radius:3px}.controls button:disabled{opacity:.35;cursor:not-allowed}.controls span{font-size:13px;color:#e9ddc4}.turn-right{animation:turnR .48s ease}.turn-left{animation:turnL .48s ease}@keyframes turnR{0%{transform:rotateY(-12deg);filter:brightness(.8)}100%{transform:rotateY(0);filter:brightness(1)}}@keyframes turnL{0%{transform:rotateY(12deg);filter:brightness(.8)}100%{transform:rotateY(0);filter:brightness(1)}}@media(max-width:650px){.top{padding:20px}.clock{display:none}.shelf{padding:25px 18px;gap:13px}.reader{padding:10px}.desk{padding:8px;border-width:6px}.spread{min-height:45vh}.page{padding:8px}.placeholder span{font-size:10px}.controls{gap:10px}.controls button{padding:10px 13px}}
</style></head><body><main class="room"><div class="light"></div><header class="top"><div class="brand"><small>THE CLASSROOM ARCHIVE · 1990s</small><h1>旧时光课本阅览室</h1></div><div class="clock">一九九五年 · 某个晴朗的午后</div></header><section class="hero"><p>那些年，我们一起翻过的书</p><h2>推开记忆的门，重读少年时光。</h2></section><section class="shelf-wrap"><div class="shelf-title">第一排书架 · 童年的课堂</div><div id="shelf" class="shelf"></div><p class="note">点击一本课本，开始翻阅 · 当前为示例书目，等待真实课本内容</p></section></main><section class="reader" id="reader" role="dialog" aria-modal="true" aria-label="课本阅读器"><header class="reader-header"><div><div class="subtle">正在阅读 / NOW READING</div><h2 id="reader-title"></h2></div><button class="plain" id="close">放回书架 ×</button></header><div class="desk"><div class="spread" id="spread"><div class="page left" id="left"></div><div class="page right" id="right"></div></div><nav class="controls"><button id="prev">← 上一页</button><span id="counter"></span><button id="next">下一页 →</button></nav></div><p class="note">← → 方向键翻页 · Esc 返回书架</p></section><script>
const books=[{id:"chinese-1",title:"语文",grade:"小学一年级 · 上册",publisher:"九十年代课本",pages:[]},{id:"math-2",title:"数学",grade:"小学二年级 · 上册",publisher:"九十年代课本",pages:[]},{id:"nature-3",title:"自然",grade:"小学三年级",publisher:"九十年代课本",pages:[]},{id:"chinese-4",title:"语文",grade:"小学四年级 · 下册",publisher:"九十年代课本",pages:[]},{id:"history-5",title:"历史",grade:"初中一年级",publisher:"九十年代课本",pages:[]},{id:"geography-6",title:"地理",grade:"初中一年级",publisher:"九十年代课本",pages:[]}];
const $=id=>document.getElementById(id);let active=null,index=0;books.forEach(b=>{let el=document.createElement("button");el.className="book";el.innerHTML='<span class="grade">'+b.grade+'</span><strong>'+b.title+'</strong><span class="publisher">'+b.publisher+'</span>';el.setAttribute("aria-label","阅读"+b.grade+b.title);el.onclick=()=>openBook(b);$("shelf").append(el)});function openBook(b){active=b;index=0;$("reader-title").textContent=b.grade+" · "+b.title;$("reader").classList.add("open");document.body.style.overflow="hidden";render()}function closeBook(){$("reader").classList.remove("open");document.body.style.overflow="";active=null}function render(direction=""){if(!active)return;let pages=active.pages;for(let [id,n] of [["left",index],["right",index+1]]){let el=$(id);el.className="page "+id+(direction?" turn-"+direction:"");el.innerHTML="";if(n<pages.length){let img=document.createElement("img");img.src=pages[n];img.alt="第"+(n+1)+"页";img.onerror=()=>{el.innerHTML='<div class="placeholder"><b>页面暂不可用</b><span>请检查图片路径</span></div>'};el.append(img)}else{el.innerHTML='<div class="placeholder"><b>'+active.title+'</b><span>旧时光，慢慢读。这里将呈现真实课本扫描页。</span></div>'}let num=document.createElement("span");num.className="page-num";num.textContent=n<pages.length?n+1:"";el.append(num)}$("prev").disabled=index===0;$("next").disabled=index+2>=Math.max(pages.length,2);$("counter").textContent=pages.length?(Math.min(index+1,pages.length)+"–"+Math.min(index+2,pages.length)+" / "+pages.length):"等待课本页面"}function turn(d){if(!active)return;let next=index+d*2;if(next<0||next>=Math.max(active.pages.length,2))return;index=next;render(d>0?"right":"left")}$("close").onclick=closeBook;$("prev").onclick=()=>turn(-1);$("next").onclick=()=>turn(1);document.addEventListener("keydown",e=>{if(!active)return;if(e.key==="Escape")closeBook();if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)});let touchX=null;$("spread").addEventListener("touchstart",e=>{touchX=e.touches[0].clientX},{passive:true});$("spread").addEventListener("touchend",e=>{if(touchX===null)return;let diff=e.changedTouches[0].clientX-touchX;if(Math.abs(diff)>55)turn(diff<0?1:-1);touchX=null},{passive:true});
</script></body></html>
